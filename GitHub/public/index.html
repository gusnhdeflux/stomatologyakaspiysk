<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лечение зубов в Каспийске</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="stage">
    <section class="hero" aria-labelledby="hero-title">
      <div class="intro">
        <h1 id="hero-title">Лечение зубов<br> в Каспийске</h1>
        <div class="clinic-photos">
          <figure class="clinic-photo reception">
            <img src="assets/reception.webp" width="290" height="219" alt="Стойка регистрации стоматологии">
            <figcaption>Удобство и<br> комфорт</figcaption>
          </figure>
          <figure class="clinic-photo treatment">
            <img src="assets/treatment.webp" width="208" height="189" alt="Врач и пациент в стоматологическом кабинете">
            <figcaption>Анестезия<br> и&nbsp;наркоз</figcaption>
          </figure>
          <div class="tooth" aria-hidden="true">
            <div class="tooth-shadow"></div>
            <div class="tooth-viewport">
              <img class="tooth-turn" src="assets/molar-turn.webp" width="4092" height="156" alt="">
            </div>
          </div>
        </div>
        <p class="promise">Лечим зубы комплексно</p>
        <nav class="specialties" aria-label="Направления стоматологии">
          <button type="button" data-panel="therapy">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M15.2 4.8c-1.4-.5-2.1.7-3.2.7-1.3 0-2-1.1-3.7-1.1-2.5 0-4 2.1-4 4.6 0 2.2 1.1 3.3 1.6 5.4.7 2.7 1.1 5.1 2.7 5.1 1.5 0 1.4-5.1 3.4-5.1s1.9 5.1 3.4 5.1c1.6 0 2-2.4 2.7-5.1.3-1.1.7-1.9 1.1-2.8"/>
              <path d="M19 3.2v5.6M16.2 6h5.6"/>
            </svg>
            <span>Терапия</span>
          </button>
          <button type="button" data-panel="surgery">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m14.6 6.2 2.6-2.6a1.7 1.7 0 0 1 2.4 2.4l-7.8 7.8-2.4-2.4zM9.4 11.4l-3 3c-1.4 1.4-1.9 3.3-2.2 5.5 2.3-.3 4.2-.8 5.6-2.2l3-3M14 8.3l1.7 1.7"/>
            </svg>
            <span>Хирургия</span>
          </button>
          <button type="button" data-panel="orthopedics">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4.4 12.4c-.8-1.6-.9-3.3-.5-4.8.4-1.6 1.7-2.8 3.4-2.8 1.8 0 3 1.3 4.7 1.3s2.9-1.3 4.7-1.3c1.7 0 3 1.2 3.4 2.8.4 1.5.3 3.2-.5 4.8-.5 1-1.2 1.5-2.4 1.5H6.8c-1.2 0-1.9-.5-2.4-1.5ZM7.3 17.1h9.4M9.4 20h5.2"/>
            </svg>
            <span>Ортопедия</span>
          </button>
        </nav>
        <div class="actions">
          <button type="button" class="primary" data-panel="booking">Запишитесь на осмотр</button>
          <button type="button" class="secondary" data-panel="services">
            <span>Перечень услуг</span>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 19V5m-5 5 5-5 5 5"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="portraits">
        <div class="portrait child"><img src="assets/child.webp" width="412" height="408" alt=""></div>
        <div class="portrait woman"><img src="assets/woman.webp" width="422" height="429" alt=""></div>
        <div class="portrait man"><img src="assets/man.webp" width="421" height="426" alt=""></div>
        <div class="portrait speech-anchor man"><p class="speech">Здоровая улыбка в 50</p></div>
        <div class="portrait speech-anchor woman"><p class="speech">Теперь я искреннее улыбаюсь</p></div>
        <div class="portrait speech-anchor child"><p class="speech">Зубы теперь не болят</p></div>
      </div>

      <div class="highlights">
        <div class="service-window" aria-hidden="true">
          <div class="service-track">
            <span>Анестезия</span>
            <span>Лечение кариеса</span>
            <span>Детский приём</span>
            <span>Снятие острой боли</span>
            <span>Анестезия</span>
          </div>
        </div>
        <ul class="visually-hidden">
          <li>Анестезия</li>
          <li>Снятие острой боли</li>
          <li>Детский приём</li>
          <li>Лечение кариеса</li>
        </ul>
      </div>
    </section>
  </main>

  <dialog class="panel" aria-labelledby="panel-title">
    <div class="panel-body">
      <form method="dialog">
        <button class="close" type="submit" aria-label="Закрыть" autofocus>×</button>
      </form>
      <h2 id="panel-title"></h2>
      <p class="panel-copy"></p>
      <ul class="panel-list"></ul>
    </div>
  </dialog>
</body>
</html>
